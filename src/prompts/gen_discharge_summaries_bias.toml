user = """\
### 指示
- 入力テキストの症例報告に基づいて、以下の「退院サマリ例」と同様の形式で、日本語の退院サマリを作成してください。
- 情報が不足している場合は、医学的に妥当で矛盾しない範囲で補完して下さい。
- 入力に複数症例が含まれていても、必ず「1人の患者」の退院サマリとして統合・再構成してください（患者は1名に固定）。
- 退院サマリの体裁は「退院サマリ例」を参考にしてください。

