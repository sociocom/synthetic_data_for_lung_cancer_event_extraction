system = """\
あなたは医療記録の専門家です。
診療録から、肺がんに関する抽出項目をアノテーションしてください。
"""

user = """\
## 指示
- 入力診療録から肺がんに関する情報を抽出し、JSON配列のみを出力する。
- コードブロック（```）や説明文は出力しない。
- 配列は`Timestamp`の昇順で出力する。
- 推測・補完禁止。本文に明記がないキーは出力しない（"不明"/null等は禁止）。
- 使用可能キーは「抽出項目リスト」に列挙されたもののみ。新規キー追加禁止。
- 抽出対象がない場合は空配列`[]`を出力する。

## オブジェクト（イベント）の単位
- 1要素（1オブジェクト）= 1つの`Timestamp` + その日に意味的に一体な情報セット。
- 同一日付でも種類が違う情報は別オブジェクトに分割する（`Timestamp`が同じオブジェクトが複数あってよい）。
  - 診断/治療/ステージ/TNM/腫瘍サイズ/再発/病理など（`ProcedureDiagnosis`等）
  - 画像・検査の評価（例：`AssessedAnatomicSite` + `PETCT`、`PDL1`、遺伝子/免疫染色など）
- `Timestamp`のみのオブジェクトは出力しない。

## 型ルール
### Date
- `Timestamp`は"YYYY-MM-DD"（ゼロパディング必須）。年月日が確実に分かるものだけ使う。

### List
- List型は必ず候補値から選ぶ。候補値にない自由記述は禁止。
- 表記ゆれ・語順差は最も近い候補値に正規化する（例: `右上葉肺` → `右肺上葉`）。
- `ProcedureDiagnosis` では、`<組織型>肺癌` / `<部位><組織型>肺癌` の語順を候補値形式（`肺<組織型>癌` / `<部位>肺<組織型>癌`）に正規化してから候補値を選ぶ。
- 候補値に`その他`があるキー:
  - 候補値へ正規化できないが、キーの意味としては該当する場合のみ`その他`を使う。

### TNM接頭語ルール
- TNMの接頭語は原文根拠に合わせて保持する。
  - `c`: 治療前の臨床分類
  - `p`: 病理分類（術後病理など）
  - `yc`: 治療後の臨床再分類
  - `yp`: 治療後の病理分類
  - `s`/`ys`: 原文に明記がある場合のみ使用
- `TNM_T`,`TNM_N`,`TNM_M` で、`c/p/yc/yp/s/ys` 付き候補値が明確に選べる場合は裸値（例: `T2`,`N1`,`M0`）に丸めない。
- `TNM_M` は `cM1c1`/`cM1c2` を `cM1c` に丸めない。最も具体的な候補値を保持する。
- `TNM_M` の裸値（`M0`,`M1`,`M1a`,`M1b`,`M1c`,`M1c1`,`M1c2`）は、原文が裸値のみで接頭語が判断不能な場合のみ使用する。

### 検査結果の+/-(陽性/陰性) ルール
- 原文に陽性/陰性の明示がある場合のみ、候補値の`+`/`-`に正規化して出力する。
- 例: `+`,`陽性`,`positive`→`+` / `-`,`陰性`,`negative`→`-`

### Number
- JSONは数値のみ（単位は書かない）。必要なら単位換算する（例: 2.4cm→24mm）。

## レンジ・複数
- 範囲表記は、スキーマで「範囲表記:あり」の項目のみ許可。原文がレンジならその文字列をそのまま出す（例：`<1`,`1-49`,`≧50`,`2.5-5`）。
- 複数記載（カンマ区切り）が許可されている項目のみ、カンマ区切りで複数値を出す。

## 特記事項
- `ProcedureDiagnosis`は肺がん主診断のみを候補値から選ぶ。肺がん以外の疾患は入れない。
- `ProcedureDiagnosis` の選択ルール（上から優先）:
  0. 先に語順正規化（`<組織型>肺癌` → `肺<組織型>癌`）を行い、正規化後の表現で候補値を選ぶ。
  1. 同一診断記載に「部位」と「組織型」が同時に明記される場合は、部位+組織型の候補値を使う（例: `左下葉肺腺癌`）。
  2. 部位は明記されるが、同一診断記載で組織型が確定しない場合は部位のみ候補値を使う（例: `左下葉肺癌`）。
  3. 右肺/左肺レベルのみ明記の場合は、右肺/左肺レベルの候補値を使う（例: `右肺癌`,`左肺腺癌`）。
  4. 部位不明で肺原発のみ明記の場合は、全肺レベルの候補値を使う（例: `肺癌`,`肺腺癌`）。
- 別行の病理所見だけを根拠に `ProcedureDiagnosis` を過度に詳細化しない。
- 同一症例内では `ProcedureDiagnosis` の粒度を統一し、明確な更新根拠がない限り混在させない（例: `右下葉肺癌` と `右下葉肺腺癌` の混在禁止）。
- `ProcedureDiagnosis` の`その他`は、肺がん関連で候補値に正規化できない場合のみ使用可。
- List型の値は候補値に完全一致させる。
- 同一内容イベントの重複出力は禁止。

