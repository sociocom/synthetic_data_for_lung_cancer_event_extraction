[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-for-lung-cancer-event-extraction"
version = "0.1.0"
description = "Clinical event extraction in lung cancer progress notes using synthetic data derived from case reports"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitsandbytes>=0.49.1",
    "datasets>=4.5.0",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.10.8",
    "openai>=2.15.0",
    "pandas>=3.0.0",
    "peft>=0.18.1",
    "torch>=2.10.0",
    "trl>=0.27.1",
]

# src/ 配下からパッケージを探す（srcレイアウト対応）
[tool.setuptools.packages.find]
where = ["src"]

# uvに「このプロジェクトをビルドして環境へインストールせよ」と明示
[tool.uv]
package = true
